minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - why-is-node-running

shellEmulator: true

packages:
  - packages/*
  - playground

overrides:
  semver@6.3.1: 7.8.5

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

catalog:
  '@iconify/vue': ^5.0.3
  '@vueuse/core': ^15.0.0

catalogs:
  build:
    '@tailwindcss/vite': ^4.3.3
    '@vitejs/plugin-vue': ^6.0.7
    nuxt: 4.5.2
    tailwindcss: ^4.3.3
    tsdown: ^0.23.0
    turbo: ^2.11.5
    vite: ^8.3.1
  config:
    '@lonewolfyx/tsconfig': ^0.0.6
  dev:
    jiti: ^2.7.0
    npm-run-all2: ^9.0.3
    simple-git-hooks: ^2.14.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite-plugin-vue-devtools: ^8.2.1
    vue-tsc: ^3.3.12
  lint:
    '@antfu/eslint-config': ^9.5.1
    '@nuxt/eslint': ^1.17.0
    eslint: ^10.11.0
    eslint-factory: ^0.1.2
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.6.0
    vue-eslint-parser: ^10.4.1
  test:
    '@vitest/coverage-v8': 5.0.2
    '@vue/test-utils': ^2.4.6
    happy-dom: ^20.8.8
    vitest: ^5.0.2
  types:
    '@types/chrome': ^0.3.4
    '@types/node': ^26.6.3
  ui:
    vue: ^3.5.43
  validation:
    zod: ^4.6.5
